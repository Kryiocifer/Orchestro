name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package build output
        run: |
          mkdir -p release
          zip -r release/orchestro-web-${{ github.sha }}.zip dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}-${{ github.run_attempt }}
          name: Automated Release ${{ github.run_number }}
          generate_release_notes: true
          files: release/orchestro-web-${{ github.sha }}.zip
